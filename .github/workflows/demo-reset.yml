name: Reset demo data

on:
  schedule:
    - cron: "30 21 * * *" # 21:30 UTC = 03:00 in India
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: read

concurrency:
  group: demo-reset
  cancel-in-progress: false

jobs:
  reset:
    name: Recreate the demo organisations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      # Set in Settings > Secrets and variables > Actions. Never committed.
      DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
      # Required by the settings, but the reset never creates login tokens.
      JWT_SECRET: not-used-by-the-demo-reset-but-required-by-settings

    steps:
      - name: Check the database secret is set
        id: check
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DEMO_DATABASE_URL isn't set yet, so there's nothing to reset."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - uses: astral-sh/setup-uv@v6
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: uv sync --locked --no-dev

      - name: Reset the demo organisations
        if: steps.check.outputs.skip != 'true'
        run: uv run python -m app.demo reset
